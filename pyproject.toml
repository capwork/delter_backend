[project]
name = "delter-backend"
version = "0.1.0"
description = "Delter: finds delete actions that use the browser's native confirm dialog instead of the platform's own."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "selenium>=4.23",
    "redis>=5.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: needs Chrome + chromedriver"]
timeout = 240
